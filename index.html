<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de Tarefas">
    <meta name="keywords" content="To-Do, Lista de Tarefas, Produtividade">
    <meta name="author" content="Maria Eduarda">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="shortcut icon" href="./src/assets/" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Music Player</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="music-player">
                <h1>Maria's Music Player</h1>
                <nav>
                    <div class="circle">
                        <ion-icon name="chevron-back-outline" id="back-btn"></ion-icon>
                    </div>
                    <div class="circle">
                        <ion-icon name="menu-outline" id="menu-btn"></ion-icon>
                    </div>
                </nav>
                <img src="./src/assets/melanie-capa.jfif" alt="Capa do álbum K-12 de Melanie Martinez" class="cover">
                <h2 class="song-title">Drama Club</h2>
                <p class="singer-name">Melanie Martinez</p>

                <audio controls id="song">
                    <source src="./src/assets/Drama Club.mp3" type="audio/mpeg">
                </audio>
                <input type="range" value="0" id="progress-bar" class="progress-bar">

                <div class="controls">
                    <div>
                        <img src="./src/assets/icons8-rewind-40.png" alt="" id="backward-btn">
                    </div>
                    <div>
                        <img src="./src/assets/icons8-reproduzir-40.png" alt="" class="play" id="play-pause-btn" onclick="togglePlayPause()">
                    </div>
                    <div>
                        <img src="./src/assets/icons8-fast-forward-40.png" alt=""  id="forward-btn">
                    </div>
                    <div>
                        <img src="./src/assets/icons8-shuffle-40.png" alt="" id="shuffle-btn">
                    </div>
                </div>
                <!-- <img src="./src/assets/bts-capa.jfif" alt="Capa do álbum Love Yourself: Answer de BTS" class="cover">
                <h2 class="song-title">Love Yourself: Answer</h2> -->
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Music Player. Todos os direitos reservados.</p>
        <p>Desenvolvido por Maria Eduarda</p>
        <p>Icones por Icons8</p>
    </footer>
    <script src="./src/js/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
